spring.application.name=gatherly

server.address=127.0.0.1
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gatherly}
spring.datasource.username=${DB_USERNAME:gatherly}
spring.datasource.password=${DB_PASSWORD:gatherly_local_dev}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always