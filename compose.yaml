name: gatherly

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gatherly
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly -d gatherly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
